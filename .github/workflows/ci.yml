name: Source validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up Node.js for the Volt JavaScript check
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install PHP CLI for PHP syntax checks
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y php-cli

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python source
        run: python -m compileall -q src/opnsense/scripts/whoisds_nrd tests

      - name: Check shell syntax
        run: |
          for script in install.sh upgrade.sh uninstall.sh; do
            sh -n "$script"
          done

      - name: Validate XML, PHP, and Volt JavaScript
        run: python scripts/validate_sources.py
