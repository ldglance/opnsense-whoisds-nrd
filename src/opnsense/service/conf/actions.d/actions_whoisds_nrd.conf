[update]
command:/usr/local/bin/python3.13 /usr/local/opnsense/scripts/whoisds_nrd/updater.py
parameters:
type:script_output
message:Update WhoisDS NRD feed and refresh Unbound DNSBL
description:Download and process the latest WhoisDS NRD archives.

[rebuild]
command:/usr/local/bin/python3.13 /usr/local/opnsense/scripts/whoisds_nrd/updater.py --rebuild
parameters:
type:script_output
message:Rebuild WhoisDS NRD aggregate with saved settings
description:Apply retention and TLD exclusions to existing daily archives without downloading.

[clear]
command:/usr/local/bin/python3.13 /usr/local/opnsense/scripts/whoisds_nrd/updater.py --clear
parameters:
type:script_output
message:Clear WhoisDS NRD data and refresh Unbound DNSBL
description:Remove all stored daily NRD archives, empty the local feed, and refresh Unbound DNSBL.

[status]
command:/usr/local/bin/python3.13 /usr/local/opnsense/scripts/whoisds_nrd/status.py
parameters:
type:script_output
message:Read WhoisDS NRD feed status
cache_ttl:5
description:Show WhoisDS NRD feed status.

[refresh]
command:/usr/local/bin/python3.13 /usr/local/opnsense/scripts/whoisds_nrd/updater.py --refresh-unbound
parameters:
type:script_output
message:Refresh Unbound DNSBL
description:Refresh Unbound DNSBL policies.

[service.start]
command:/usr/sbin/service whoisds_nrd start
parameters:
type:script_output
message:Start WhoisDS NRD local HTTP service
description:Start the local WhoisDS NRD HTTP endpoint.

[service.stop]
command:/usr/sbin/service whoisds_nrd stop
parameters:
type:script_output
message:Stop WhoisDS NRD local HTTP service
description:Stop the local WhoisDS NRD HTTP endpoint.

[service.restart]
command:/usr/sbin/service whoisds_nrd restart
parameters:
type:script_output
message:Restart WhoisDS NRD local HTTP service
description:Restart the local WhoisDS NRD HTTP endpoint.
